<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 · 분개 안내</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">분개<span>안내</span></span>
      </a>
      <a class="nav-cta" href="index.html">안내 페이지</a>
    </div>
  </nav>

  <section class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <h2>관리자 비밀번호</h2>
      <p>질문과 결과(부가세·분개)를 나누어 수정합니다.</p>
      <form id="lockForm">
        <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" />
        <button type="submit" class="btn btn-ok">확인</button>
      </form>
    </div>
  </section>

  <section id="adminApp" hidden>
    <div class="wrap admin-layout">
      <aside class="card">
        <div class="card-head">
          <h2>검색 주제</h2>
          <button type="button" class="btn btn-ok" id="btnNew">새 주제</button>
        </div>
        <div class="admin-list" id="topicList"></div>
      </aside>

      <form class="card" id="topicForm">
        <div class="card-head">
          <h2 id="editorTitle">주제 수정</h2>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="btnReset">기본값으로</button>
            <button type="button" class="btn btn-danger" id="btnDelete">주제 삭제</button>
            <button type="submit" class="btn btn-ok">저장</button>
          </div>
        </div>
        <div class="form-body">
          <input type="hidden" id="topicId" />
          <label class="field">검색에 걸릴 이름
            <input id="title" required placeholder="예: 복리후생비" />
          </label>
          <label class="field">검색 키워드 (쉼표)
            <input id="keywords" placeholder="식대, 야근, 회식" />
          </label>

          <div class="tabs" role="tablist">
            <button type="button" class="tab active" id="tabQuestion" data-tab="question">질문 <span class="count" id="qCount">0</span></button>
            <button type="button" class="tab" id="tabResult" data-tab="result">결과 <span class="count" id="rCount">0</span></button>
          </div>
          <p class="help-box" id="tabHelp">질문은 현업에게 묻는 말입니다. 보기에서 다음 질문 또는 최종 결과로 연결하세요.</p>
          <div class="split-edit">
            <div>
              <div class="btn-row" style="margin-bottom:8px">
                <button type="button" class="btn btn-ok" id="btnAddNode">질문 추가</button>
              </div>
              <div class="node-list" id="nodeList"></div>
            </div>
            <div id="nodeEditor"></div>
          </div>
        </div>
      </form>
    </div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
