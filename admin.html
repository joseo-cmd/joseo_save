<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 · 분개 안내</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/app.css?v=upd1" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">분개<span>안내</span></span>
      </a>
      <div class="nav-right">
        <a class="nav-cta" href="index.html">안내 페이지</a>
      </div>
    </div>
  </nav>

  <section class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <h2>관리자 비밀번호</h2>
      <p>로그인 후 검색 주제와 자주 찾는 항목을 바꿀 수 있습니다.</p>
      <div class="lock-preview">
        <div class="lock-preview-q">질문<br /><small>무엇을 물을지</small></div>
        <div class="lock-preview-r">결과<br /><small>부가세 · 분개</small></div>
      </div>
      <form id="lockForm">
        <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" />
        <button type="submit" class="btn btn-ok">확인</button>
      </form>
    </div>
  </section>

  <section id="adminApp" hidden>
    <div class="wrap admin-page">
      <div class="page-tabs" role="tablist">
        <button type="button" class="page-tab active" id="pageTopics" data-page="topics">
          <span class="mode-kicker">내용</span>
          <strong>검색 주제</strong>
          <em>질문 · 부가세 · 분개</em>
        </button>
        <button type="button" class="page-tab is-pop" id="pagePopular" data-page="popular">
          <span class="mode-kicker">화면</span>
          <strong>자주 찾는 항목</strong>
          <em>안내 페이지에 보일 키워드</em>
        </button>
      </div>

      <div class="admin-layout" id="viewTopics">
      <aside class="card">
        <div class="card-head">
          <h2>검색 주제</h2>
          <button type="button" class="btn btn-ok" id="btnNew">새 주제</button>
        </div>
        <div class="admin-list" id="topicList"></div>
      </aside>

      <form class="card" id="topicForm">
        <div class="card-head">
          <h2 id="editorTitle">주제 수정</h2>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="btnReset">기본값으로</button>
            <button type="button" class="btn btn-danger" id="btnDelete">주제 삭제</button>
            <button type="submit" class="btn btn-ok">저장</button>
          </div>
        </div>
        <div class="form-body">
          <input type="hidden" id="topicId" />
          <label class="field">검색에 걸릴 이름
            <input id="title" required placeholder="예: 복리후생비" />
          </label>
          <label class="field">검색 키워드 (쉼표)
            <input id="keywords" placeholder="식대, 야근, 회식" />
          </label>

          <div class="mode-tabs" role="tablist">
            <button type="button" class="mode-tab is-q active" id="tabQuestion" data-tab="question">
              <span class="mode-kicker">1단계</span>
              <strong>질문</strong>
              <em>현업에게 무엇을 물을지</em>
              <span class="count" id="qCount">0</span>
            </button>
            <button type="button" class="mode-tab is-r" id="tabResult" data-tab="result">
              <span class="mode-kicker">2단계</span>
              <strong>결과</strong>
              <em>부가세 · 분개 안내</em>
              <span class="count" id="rCount">0</span>
            </button>
          </div>
          <p class="help-box" id="tabHelp">지금은 <b>질문</b>을 수정하는 화면입니다. 보기에서 다음이 질문인지 결과인지를 고르세요.</p>
          <div class="split-edit">
            <div>
              <div class="btn-row" style="margin-bottom:8px">
                <button type="button" class="btn btn-ok" id="btnAddNode">질문 추가</button>
              </div>
              <div class="node-list" id="nodeList"></div>
            </div>
            <div id="nodeEditor"></div>
          </div>
        </div>
      </form>
      </div>

      <div class="admin-layout" id="viewPopular" hidden>
        <aside class="card">
          <div class="card-head">
            <h2>키워드 고르기</h2>
          </div>
          <div class="form-body">
            <p class="hint">주제 이름이나 검색 키워드를 누르면 오른쪽에 추가됩니다.</p>
            <div class="popular-pool" id="popularPool"></div>
          </div>
        </aside>

        <form class="card" id="popularForm">
          <div class="card-head">
            <h2>안내 페이지에 보일 항목</h2>
            <button type="submit" class="btn btn-ok">저장</button>
          </div>
          <div class="form-body">
            <p class="help-box">이 순서대로 안내 페이지 왼쪽 <b>자주 찾는 항목</b>에 보입니다. 누르면 그 키워드로 검색합니다.</p>
            <div class="popular-add">
              <input id="popularCustom" placeholder="직접 입력 (예: 식대, 야근)" />
              <button type="button" class="btn btn-ghost" id="btnAddPopular">추가</button>
            </div>
            <div class="popular-list" id="popularList"></div>
          </div>
        </form>
      </div>
    </div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/store.js?v=upd1"></script>
  <script src="js/admin.js?v=upd1"></script>
</body>
</html>
