<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>판교런치 — 판교 직장인 점심 가이드</title>
  <meta name="description" content="점심만 되면 무엇을 먹어야 하나, 고민하는 판교 직장인들을 위해 판교지역 점심메뉴 추천해드립니다." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --ink: #1a1f2e;
      --ink-soft: #4a5168;
      --muted: #8b92a8;
      --line: #e4e7ef;
      --paper: #f7f8fb;
      --white: #ffffff;
      --blue: #1a3a6b;
      --blue-deep: #0f2749;
      --blue-soft: #e8eef8;
      --accent: #2d6cdf;
      --good: #1f7a4c;
      --warn: #b45309;
      --radius: 4px;
      --shadow: 0 12px 40px rgba(26, 58, 107, 0.08);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      --max: 1120px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e8eef8 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f0f3f9 0%, transparent 50%),
        var(--paper);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    ul { list-style: none; }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
    }

    /* —— Header —— */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(247, 248, 251, 0.85);
      border-bottom: 1px solid transparent;
      transition: border-color 0.25s, background 0.25s;
    }
    .header.scrolled {
      border-bottom-color: var(--line);
      background: rgba(255, 255, 255, 0.92);
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-shrink: 0;
    }
    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blue);
      position: relative;
    }
    .logo-mark::after {
      content: "";
      position: absolute;
      inset: 7px 9px 9px 9px;
      border: 2px solid #fff;
      border-top: 0;
      border-radius: 0 0 10px 10px;
    }
    .logo-text {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      color: var(--blue);
    }
    .search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      max-width: 420px;
      margin-left: auto;
      padding: 0.55rem 0.9rem;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.12);
    }
    .search svg { flex-shrink: 0; color: var(--muted); }
    .search input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.9rem;
      background: transparent;
      color: var(--ink);
      min-width: 0;
    }
    .search input::placeholder { color: var(--muted); }
    .wish-nav {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--blue);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .wish-nav:hover,
    .wish-nav.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .wish-nav .badge {
      min-width: 1.25rem;
      height: 1.25rem;
      padding: 0 0.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
    }
    .wish-nav:hover .badge,
    .wish-nav.active .badge {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .wish-nav .badge:empty,
    .wish-nav .badge[data-count="0"] { display: none; }

    /* —— Hero —— */
    .hero {
      position: relative;
      min-height: min(88vh, 720px);
      display: grid;
      align-items: end;
      overflow: hidden;
      color: #fff;
    }
    .hero-media {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      animation: heroZoom 18s ease-out forwards;
    }
    @keyframes heroZoom {
      to { transform: scale(1); }
    }
    .hero-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(15, 39, 73, 0.25) 0%, rgba(15, 39, 73, 0.55) 45%, rgba(15, 39, 73, 0.88) 100%);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      padding: 3.5rem 0 4rem;
      animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-brand {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.08;
      max-width: 12ch;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: clamp(1rem, 2vw, 1.15rem);
      opacity: 0.9;
      max-width: 36ch;
      margin-bottom: 1.75rem;
      font-weight: 400;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.85rem 1.35rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 999px;
      transition: transform 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #fff;
      color: var(--blue-deep);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    .btn-primary:hover { background: #f0f4ff; }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(6px);
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.2); }

    /* —— Sections —— */
    section { padding: 3.25rem 0; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .section-head h2 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .section-head .hint {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* —— Category chips —— */
    .chips-rail {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      padding-bottom: 0.35rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chips-rail::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 0.55rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink-soft);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    }
    .chip:hover {
      border-color: var(--blue);
      color: var(--blue);
      transform: translateY(-1px);
    }
    .chip.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    /* —— Quick filters —— */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .filter {
      padding: 0.45rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-soft);
      background: transparent;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      transition: all 0.2s;
    }
    .filter:hover { border-color: var(--accent); color: var(--accent); }
    .filter.active {
      background: var(--blue-soft);
      border-style: solid;
      border-color: var(--accent);
      color: var(--blue);
    }

    /* —— Today's pick —— */
    .today {
      padding-top: 1.5rem;
    }
    .today-card {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 0;
      background: var(--white);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 320px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .today-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .today-card.swap {
      animation: swapPulse 0.45s ease;
    }
    @keyframes swapPulse {
      0% { opacity: 0.4; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .today-visual {
      position: relative;
      min-height: 280px;
      overflow: hidden;
    }
    .today-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .today-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: var(--blue);
      color: #fff;
    }
    .today-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 2.25rem;
    }
    .today-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
    .today-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .today-meta span + span::before {
      content: "·";
      margin-right: 0.5rem;
      color: var(--line);
    }
    .today-body h3 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.65rem;
    }
    .today-body .reason {
      color: var(--ink-soft);
      font-size: 1rem;
      margin-bottom: 1.5rem;
      max-width: 36ch;
    }
    .btn-outline {
      align-self: flex-start;
      padding: 0.7rem 1.2rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--blue);
      border: 1.5px solid var(--blue);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-outline:hover {
      background: var(--blue);
      color: #fff;
    }

    /* —— Restaurant list —— */
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .result-count {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .result-count strong { color: var(--ink); font-weight: 700; }
    .list-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .view-tabs {
      display: inline-flex;
      padding: 0.2rem;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .view-tab {
      padding: 0.4rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    .view-tab.active {
      background: var(--blue);
      color: #fff;
    }
    .clear-wish {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      display: none;
    }
    .clear-wish.show { display: inline; }
    .clear-wish:hover { color: var(--blue); }
    .sort-note {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .save-btn {
      position: absolute;
      top: 0.55rem;
      right: 0.55rem;
      z-index: 2;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: var(--muted);
      box-shadow: 0 2px 10px rgba(15, 39, 73, 0.12);
      transition: color 0.2s, background 0.2s, transform 0.2s;
    }
    .save-btn:hover { transform: scale(1.06); color: var(--blue); }
    .save-btn.active {
      color: #fff;
      background: var(--blue);
    }
    .save-btn svg { width: 16px; height: 16px; }
    .today-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
    }
    .btn-save-today {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.15rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink-soft);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-save-today:hover {
      border-color: var(--blue);
      color: var(--blue);
    }
    .btn-save-today.active {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: var(--blue);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      z-index: 100;
      transform: translateX(-50%) translateY(120%);
      padding: 0.75rem 1.2rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      background: var(--blue-deep);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(15, 39, 73, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    .place {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 0;
      background: var(--white);
      border: 1px solid var(--line);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.25s, transform 0.25s;
      opacity: 0;
      transform: translateY(12px);
      animation: cardIn 0.5s ease forwards;
    }
    .place:hover {
      border-color: #c5cedf;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }
    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .place-thumb {
      position: relative;
      min-height: 140px;
      overflow: hidden;
      background: var(--blue-soft);
    }
    .place-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .place:hover .place-thumb img { transform: scale(1.06); }
    .place-body {
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.4rem;
    }
    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.45rem;
      background: var(--blue-soft);
      color: var(--blue);
      letter-spacing: -0.01em;
    }
    .tag.quiet {
      background: #f0f1f5;
      color: var(--ink-soft);
    }
    .place-body h3 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .place-desc {
      font-size: 0.82rem;
      color: var(--ink-soft);
      margin-bottom: 0.65rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .place-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }
    .place-stats .ok { color: var(--good); }
    .place-stats .mid { color: var(--warn); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--muted);
      background: var(--white);
      border: 1px dashed var(--line);
    }
    .empty strong {
      display: block;
      color: var(--ink);
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
    }

    /* —— Areas —— */
    .areas {
      background: linear-gradient(180deg, transparent, rgba(232, 238, 248, 0.55));
    }
    .area-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.85rem;
    }
    .area {
      padding: 1.35rem 1.15rem;
      background: var(--white);
      border: 1px solid var(--line);
      text-align: left;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .area:hover,
    .area.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      transform: translateY(-2px);
    }
    .area strong {
      display: block;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      color: var(--blue);
    }
    .area span {
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    /* —— Footer —— */
    .footer {
      padding: 2.5rem 0 3rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }
    .footer .logo-text { font-size: 1rem; }

    /* —— Responsive —— */
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .today-card { grid-template-columns: 1fr; }
      .today-visual { min-height: 220px; }
      .area-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .header-inner { height: 56px; gap: 0.5rem; }
      .logo-text { font-size: 1.05rem; }
      .wish-nav span.label { display: none; }
      .wish-nav { padding: 0.5rem 0.7rem; }
      .search { max-width: none; padding: 0.45rem 0.75rem; margin-left: 0; }
      .hero { min-height: 78vh; }
      .hero-content { padding: 2.5rem 0 3rem; }
      .place { grid-template-columns: 110px 1fr; }
      .place-thumb { min-height: 120px; }
      .today-body { padding: 1.5rem 1.25rem; }
      .area-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header" id="header">
    <div class="wrap header-inner">
      <a href="#" class="logo" aria-label="판교런치 홈">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">판교런치</span>
      </a>
      <label class="search" for="searchInput">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
        </svg>
        <input id="searchInput" type="search" placeholder="식당·메뉴 검색" autocomplete="off" />
      </label>
      <button type="button" class="wish-nav" id="wishNav" aria-pressed="false" title="가고 싶은 식당">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
        <span class="label">가고 싶은</span>
        <span class="badge" id="wishBadge" data-count="0">0</span>
      </button>
    </div>
  </header>

      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);

      return n.toLocaleString("ko-KR") + "원대";
    }

      if (wait === "적음") return "ok";
      if (wait === "많음") return "mid";

      return state.wishlist.has(id);
    }

    function toggleWish(id) {
      const added = !state.wishlist.has(id);
      if (added) state.wishlist.add(id);
      else state.wishlist.delete(id);
      saveWishlist();
      updateWishUI();
      renderList();
      syncTodaySave();
      showToast(added ? "가고 싶은 식당에 담았어요" : "목록에서 뺐어요");
      return added;
    }

      const n = state.wishlist.size;
      els.wishBadge.textContent = String(n);
      els.wishBadge.dataset.count = String(n);
      els.wishNav.classList.toggle("active", state.view === "wish");
      els.wishNav.setAttribute("aria-pressed", state.view === "wish" ? "true" : "false");
      els.tabAll.classList.toggle("active", state.view === "all");
      els.tabWish.classList.toggle("active", state.view === "wish");

      els.clearWish.classList.toggle("show", state.view === "wish" && n > 0);

    }

      state.view = view;
      updateWishUI();
      renderList();
      if (view === "wish") {
        document.getElementById("list").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function matches(place) {
      if (state.view === "wish" && !state.wishlist.has(place.id)) return false;
      if (state.category !== "전체" && place.category !== state.category) return false;
      if (state.area !== "전체" && place.area !== state.area) return false;
      if (state.filters.has("cheap") && place.price > 10000) return false;
      if (state.filters.has("nowait") && place.wait !== "적음") return false;
      if (state.filters.has("near") && place.walk > 5) return false;
      if (state.filters.has("solo") && !place.solo) return false;
      if (state.query) {
        const q = state.query.toLowerCase();
        const hay = `${place.name} ${place.category} ${place.area} ${place.desc}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    function filtered() {
      return PLACES.filter(matches).sort((a, b) => a.walk - b.walk || a.price - b.price);
    }

        <article class="place" style="animation-delay:${Math.min(i * 0.04, 0.4)}s">
          <div class="place-thumb">
            <button type="button" class="save-btn${wished ? " active" : ""}" data-wish="${p.id}" aria-label="${wished ? "가고 싶은 목록에서 제거" : "가고 싶은 목록에 추가"}" aria-pressed="${wished}">
              ${BOOKMARK_SVG}
            </button>
            <img src="${p.img}" alt="${p.name}" loading="lazy" width="280" height="200" />
          </div>
          <div class="place-body">
            <div class="place-tags">
              <span class="tag">${p.category}</span>
              <span class="tag quiet">${p.area}</span>
            </div>
            <h3>${p.name}</h3>
            <p class="place-desc">${p.desc}</p>
            <div class="place-stats">
              <span>${formatPrice(p.price)}</span>
              <span>도보 ${p.walk}분</span>
              <span class="${waitClass(p.wait)}">웨이팅 ${p.wait}</span>
              ${p.solo ? '<span class="ok">혼밥 OK</span>' : ""}
            </div>
          </div>
        </article>`;
      }).join("");
    }

    function syncTodaySave() {
      if (state.todayId == null) return;
      const wished = isWished(state.todayId);
      els.todaySave.classList.toggle("active", wished);
      els.todaySave.setAttribute("aria-pressed", wished ? "true" : "false");
      els.todaySaveLabel.textContent = wished ? "담아둠" : "가고 싶은";
    }

    function pickToday(preferFiltered = true) {
      const base = preferFiltered
        ? PLACES.filter((p) => {
            const prev = state.view;
            state.view = "all";
            const ok = matches(p);
            state.view = prev;
            return ok;
          })
        : PLACES;
      const source = base.length ? base : PLACES;
      let candidates = source.filter((p) => p.id !== state.todayId);
      if (!candidates.length) candidates = source;
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      state.todayId = pick.id;
      renderToday(pick, true);
    }

    function renderToday(place, animate) {
      els.todayImg.src = place.img;
      els.todayImg.alt = place.name;
      els.todayMeta.innerHTML = `
        <span>${place.category}</span>
        <span>${place.area}</span>
        <span>${formatPrice(place.price)}</span>
        <span>도보 ${place.walk}분</span>
      `;
      els.todayName.textContent = place.name;
      els.todayReason.textContent = place.reason;
      els.todayCard.classList.add("visible");
      syncTodaySave();
      if (animate) {
        els.todayCard.classList.remove("swap");
        void els.todayCard.offsetWidth;
        els.todayCard.classList.add("swap");
      }
    }

    function refresh() {
      renderChips();
      renderFilters();
      renderAreas();
      renderList();
    }

    els.chips.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      state.category = btn.dataset.cat;
      refresh();
    });

    els.filters.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-filter]");
      if (!btn) return;
      const id = btn.dataset.filter;
      if (state.filters.has(id)) state.filters.delete(id);
      else state.filters.add(id);
      refresh();
    });

    els.areas.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-area]");
      if (!btn) return;
      state.area = btn.dataset.area;
      refresh();
    });

    els.search.addEventListener("input", () => {
      state.query = els.search.value.trim();
      renderList();
    });

    els.grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-wish]");
      if (!btn) return;
      toggleWish(Number(btn.dataset.wish));
    });

    els.todaySave.addEventListener("click", () => {
      if (state.todayId == null) return;
      toggleWish(state.todayId);
    });

    els.wishNav.addEventListener("click", () => {
      setView(state.view === "wish" ? "all" : "wish");
    });

    els.tabAll.addEventListener("click", () => setView("all"));
    els.tabWish.addEventListener("click", () => setView("wish"));

    els.clearWish.addEventListener("click", () => {
      if (!state.wishlist.size) return;
      if (!confirm("가고 싶은 식당을 모두 삭제할까요?")) return;
      state.wishlist.clear();
      saveWishlist();
      updateWishUI();
      renderList();
      syncTodaySave();
      showToast("목록을 비웠어요");
    });

    els.reroll.addEventListener("click", () => pickToday(true));
    els.heroRandom.addEventListener("click", () => {
      pickToday(true);
      document.getElementById("today").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    window.addEventListener("scroll", () => {
      els.header.classList.toggle("scrolled", window.scrollY > 12);
    }, { passive: true });

    refresh();
    pickToday(false);
  </script>
</body>
</html>
