<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회계분개 · 부가세 안내</title>
  <meta name="description" content="검색 후 질문에 답하면 부가세 공제 여부와 분개가 나옵니다." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/app.css?v=acct1" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html" aria-label="홈">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">분개<span>안내</span></span>
      </a>
      <div class="nav-right">
        <span class="nav-updated" id="updatedAt" hidden></span>
        <a class="nav-cta" href="admin.html">관리자</a>
      </div>
    </div>
  </nav>

  <div class="shell">
    <aside class="pane pane-search">
      <h1>이 거래,<br /><em>어떻게 처리하죠?</em></h1>
      <p class="hint">검색하면 몇 가지를 확인한 뒤 부가세와 분개를 알려드려요.</p>
      <form class="search-box" id="searchForm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
        </svg>
        <input id="q" type="search" placeholder="예: 복리후생비" autocomplete="off" />
        <button type="submit">검색</button>
      </form>
      <div>
        <p class="hint" style="margin-bottom:8px">자주 찾는 항목</p>
        <div class="chips" id="popular"></div>
      </div>
      <div class="chat-actions">
        <button type="button" class="back-q" id="btnBack" hidden>이전 질문으로</button>
        <button type="button" class="restart" id="btnRestart">대화 다시 시작</button>
      </div>
    </aside>

    <section class="pane pane-chat" aria-live="polite">
      <div class="thread" id="thread"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/store.js?v=acct1"></script>
  <script src="js/app.js?v=acct1"></script>
</body>
</html>
