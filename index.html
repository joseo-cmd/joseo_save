<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에이텍컴퓨터 회계노트</title>
  <meta name="description" content="에이텍컴퓨터 회계노트. 검색 후 질문에 답하면 부가세 공제 여부와 분개가 나옵니다." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/app.css?v=pub9" />
  <script>
    (function () {
      var v = "pub9";
      document.addEventListener("click", function (e) {
        var a = e.target.closest("a[data-fresh]");
        if (!a) return;
        e.preventDefault();
        var path = (a.getAttribute("href") || "index.html").split("?")[0];
        location.href = path + "?v=" + v + "&t=" + Date.now();
      });
    })();
  </script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html?v=pub9" data-fresh aria-label="홈">
        <img class="logo-img" src="images/atec-logo.png" alt="ATEC" />
        <span class="logo-text">에이텍컴퓨터 <span>회계노트</span></span>
      </a>
      <div class="nav-right">
        <span class="nav-updated" id="updatedAt" hidden></span>
        <a class="nav-cta" href="admin.html?v=pub9" data-fresh>관리자</a>
      </div>
    </div>
  </nav>

  <div class="shell">
    <aside class="pane pane-search">
      <h1>이 거래,<br /><em>어떻게 처리하죠?</em></h1>
      <p class="hint">검색하면 몇 가지를 확인한 뒤 부가세와 분개를 알려드려요.</p>
      <form class="search-box" id="searchForm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
        </svg>
        <input id="q" type="search" placeholder="예: 복리후생비" autocomplete="off" />
        <button type="submit">검색</button>
      </form>
      <div>
        <p class="hint" style="margin-bottom:8px">자주 찾는 항목</p>
        <div class="chips" id="popular"></div>
      </div>
      <div class="chat-actions">
        <button type="button" class="back-q" id="btnBack" hidden>이전 질문으로</button>
        <button type="button" class="restart" id="btnRestart">대화 다시 시작</button>
      </div>
      <div class="ask-box">
        <button type="button" class="ask-launch" id="btnAsk" aria-expanded="false" aria-controls="askBoard">
          <span class="ask-bulb" aria-hidden="true">
            <svg viewBox="0 0 64 72" fill="none">
              <g class="ask-bulb-rays">
                <path d="M32 2v8" />
                <path d="M12.5 10.5l5.5 5.5" />
                <path d="M51.5 10.5L46 16" />
                <path d="M6 32h8" />
                <path d="M50 32h8" />
              </g>
              <path class="ask-bulb-glass" d="M32 12c-10.5 0-18 8.2-18 18.4 0 6.4 3.4 11.2 8.2 15.3 1.6 1.4 2.8 3.3 3.2 5.3h13.2c.4-2 1.6-3.9 3.2-5.3 4.8-4.1 8.2-8.9 8.2-15.3C50 20.2 42.5 12 32 12z" />
              <path class="ask-bulb-filament" d="M26 30c2.2 3 4.4 3 6 0 1.6 3 3.8 3 6 0" />
              <path class="ask-bulb-base" d="M25.5 51h13v4.2h-13zM24 56.2h16v3.2H24zM26.5 60.4h11v3.4c0 1.6-1.8 3-5.5 3s-5.5-1.4-5.5-3v-3.4z" />
            </svg>
          </span>
          <span class="ask-launch-label">문의남기기</span>
        </button>
        <div class="ask-board" id="askBoard" hidden>
          <div class="ask-board-head">
            <strong>문의 게시판</strong>
            <button type="button" class="ask-board-close" id="btnAskClose">닫기</button>
          </div>
          <div class="ask-feed" id="askFeed"></div>
          <form class="ask-form" id="askForm">
            <div class="ask-who">
              <label class="field">부서
                <input id="askDept" required maxlength="40" placeholder="영업1팀" />
              </label>
              <label class="field">닉네임
                <input id="askNick" required maxlength="20" placeholder="민지" />
              </label>
            </div>
            <label class="field">문의
              <textarea id="askText" required rows="2" maxlength="90" placeholder="2~3줄로 남겨 주세요."></textarea>
            </label>
            <button type="submit" class="btn btn-ok">남기기</button>
          </form>
        </div>
      </div>
    </aside>

    <section class="pane pane-chat" aria-live="polite">
      <img class="chat-notebook-bg" src="images/chat-notebook.svg" alt="" aria-hidden="true" />
      <div class="thread" id="thread"></div>
    </section>
  </div>

  <footer class="site-foot">Made by Seo</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/store.js?v=pub9"></script>
<script src="js/app.js?v=pub9"></script>
</body>
</html>
