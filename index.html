<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회계분개 · 부가세 안내</title>
  <meta name="description" content="현업 거래별로 회계분개와 부가세 처리 여부를 안내합니다." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="wrap topbar-inner">
      <span>현업 회계처리 안내</span>
      <span id="dataSource">기본 예시 안내</span>
    </div>
  </div>
  <header class="header">
    <div class="wrap header-inner">
      <div>
        <a class="logo" href="index.html" aria-label="홈">
          <span class="logo-en">ATEC</span>
          <span class="logo-ko">회계분개 안내</span>
        </a>
        <p class="eyebrow">Journal &amp; VAT Guide</p>
        <h1>이 거래, 어떻게 분개하고 부가세는?</h1>
      </div>
      <div class="header-meta">
        <strong id="entryCount">0건</strong>
        거래 유형을 검색하거나 골라 보세요
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="wrap">
      <section class="search-card" aria-label="검색과 필터">
        <label class="search-row" for="q">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
          </svg>
          <input id="q" type="search" placeholder="예: 접대비, 세금계산서, 택시, 급여, 수출…" autocomplete="off" />
        </label>
        <div class="legend" id="catChips" role="list"></div>
        <div class="legend" id="vatChips" role="list" aria-label="부가세 처리"></div>
        <p class="hint" style="margin-top:10px;">부가세 배지를 보면 공제·예수·면세·해당없음을 바로 구분할 수 있습니다.</p>
      </section>

      <div class="results-head">
        <h2>안내 목록</h2>
        <span id="resultMeta">0건</span>
      </div>
      <div class="grid" id="list"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>현장 담당자용 분개·부가세 가이드 · 최종 판단은 증빙과 회계팀 확인</span>
      <a href="admin.html">관리자</a>
    </div>
  </footer>

  <div class="overlay" id="overlay" hidden>
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-head">
        <div>
          <span class="entry-cat" id="detailCat"></span>
          <h2 id="detailTitle"></h2>
        </div>
        <button type="button" class="close-btn" id="closeDetail" aria-label="닫기">×</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </article>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
